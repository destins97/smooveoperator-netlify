[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"

# Legacy paths from earlier versions of the site
[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301
[[redirects]]
  from = "/terms.html"
  to = "/terms/"
  status = 301
# About, Capabilities and Our approach were folded into the homepage and Suppliers page
[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/capabilities/*"
  to = "/#rules"
  status = 301
[[redirects]]
  from = "/operations/*"
  to = "/#path"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-PtdI6/36DhPdMEgjNWV5ExIEqFovVcjUHPeOyApfBhs='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
